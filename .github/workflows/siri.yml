name: threads-siri
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: threads-siri
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post thread berantai yang sudah tiba masa
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python threads_siri.py
      - name: Simpan status
        if: always()
        run: |
          git config user.name "threads-siri"
          git config user.email "actions@users.noreply.github.com"
          git add siri.csv
          git diff --cached --quiet || (git commit -m "status siri [skip ci]" && git pull --rebase -X theirs -q && git push)
